<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <defs>
    <!-- NixOS Dark Blue Gradient -->
    <linearGradient id="nix-dark" x1="-180" y1="-200" x2="55" y2="-115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4b6cb7" />
      <stop offset="55%" stop-color="#4362a5" />
      <stop offset="100%" stop-color="#3b5692" />
    </linearGradient>

    <!-- NixOS Light Blue Gradient -->
    <linearGradient id="nix-light" x1="-180" y1="-200" x2="55" y2="-115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#75b6e5" />
      <stop offset="55%" stop-color="#69a7d8" />
      <stop offset="100%" stop-color="#5a93c6" />
    </linearGradient>

    <!-- Tux Beak Gradients -->
    <linearGradient id="tux-beak-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe033" />
      <stop offset="65%" stop-color="#f7b500" />
      <stop offset="100%" stop-color="#e59800" />
    </linearGradient>

    <linearGradient id="tux-beak-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e59400" />
      <stop offset="100%" stop-color="#c47100" />
    </linearGradient>

    <!-- Single NixOS Lambda Element (scaled stroke-width 6.94 = 2.5px at 0.36 scale) -->
    <polygon id="nix-lambda" stroke="#ffffff" stroke-width="6.94" stroke-linejoin="round" paint-order="stroke fill" points="
      54.85,-115.00
      -210.73,-115.00
      -181.87,-165.00
      -124.13,-165.00
      -153.00,-215.00
      -138.56,-240.00
      -109.70,-240.00
      -66.40,-165.00
      25.98,-165.00
    " />
  </defs>

  <!-- Typography Group: "f", "u", "i" with thin white outer outline -->
  <g fill="#22272e" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">
    <!-- Letter "f" -->
    <path d="M 122,230
             L 122,124
             L 98,124
             A 6,6 0 0 1 92,118
             L 92,102
             A 6,6 0 0 1 98,96
             L 122,96
             L 122,82
             C 122,48 144,32 178,32
             L 192,32
             A 6,6 0 0 1 198,38
             L 198,54
             A 6,6 0 0 1 192,60
             L 180,60
             C 164,60 156,67 156,83
             L 156,96
             L 186,96
             A 6,6 0 0 1 192,102
             L 192,118
             A 6,6 0 0 1 186,124
             L 156,124
             L 156,230
             A 6,6 0 0 1 150,236
             L 128,236
             A 6,6 0 0 1 122,230 Z" />

    <!-- Letter "u" -->
    <path d="M 216,102
             A 6,6 0 0 1 222,96
             L 244,96
             A 6,6 0 0 1 250,102
             L 250,178
             C 250,198 261,208 279,208
             C 297,208 308,198 308,178
             L 308,102
             A 6,6 0 0 1 314,96
             L 336,96
             A 6,6 0 0 1 342,102
             L 342,230
             A 6,6 0 0 1 336,236
             L 315,236
             A 6,6 0 0 1 309,230
             L 309,219
             C 299,232 284,238 267,238
             C 236,238 216,217 216,182
             Z" />

    <!-- Letter "i" stem -->
    <rect x="384" y="96" width="34" height="140" rx="6" />
  </g>

  <!-- Letter "i" top dot: Tux Yellow Beak -->
  <g id="tux-beak" transform="translate(401, 60)">
    <!-- Outer white outline backing for the full beak silhouette -->
    <g fill="#ffffff" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">
      <path d="M -29,4 Q 0,29 29,4 Q 0,13 -29,4 Z" />
      <path d="M -34,3 C -36,-2 -16,-22 0,-22 C 16,-22 36,-2 34,3 Q 0,15 -34,3 Z" />
    </g>
    <!-- Lower bill -->
    <path d="M -29,4
             Q 0,29 29,4
             Q 0,13 -29,4 Z" fill="url(#tux-beak-bottom)" />
    <!-- Upper bill -->
    <path d="M -34,3
             C -36,-2 -16,-22 0,-22
             C 16,-22 36,-2 34,3
             Q 0,15 -34,3 Z" fill="url(#tux-beak-top)" />
    <!-- Mouth line crease -->
    <path d="M -33,3 Q 0,14 33,3" fill="none" stroke="#995200" stroke-width="2.2" stroke-linecap="round" />
    <!-- Beak top gloss highlight -->
    <path d="M -16,-7 Q 0,-17 16,-7" fill="none" stroke="#fff3a1" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Letter "o": NixOS Logomark -->
  <g id="nixos-o" transform="translate(555, 160) scale(0.36)">
    <!-- Dark Blue Lambdas (0, 120, 240 degrees) -->
    <use href="#nix-lambda" fill="url(#nix-dark)" transform="rotate(0)" />
    <use href="#nix-lambda" fill="url(#nix-dark)" transform="rotate(120)" />
    <use href="#nix-lambda" fill="url(#nix-dark)" transform="rotate(240)" />

    <!-- Light Blue Lambdas (60, 180, 300 degrees) -->
    <use href="#nix-lambda" fill="url(#nix-light)" transform="rotate(60)" />
    <use href="#nix-lambda" fill="url(#nix-light)" transform="rotate(180)" />
    <use href="#nix-lambda" fill="url(#nix-light)" transform="rotate(300)" />
  </g>
</svg>
